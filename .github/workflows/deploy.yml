name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            cd /var/www/evaya-naturals-internal
            git pull origin main

            echo "Building server..."
            cd server
            npm ci
            npm run build

            echo "Building client..."
            cd ../client
            npm ci
            npm run build

            echo "=== Nginx site configs ==="
            ls /etc/nginx/sites-enabled/ 2>/dev/null || echo "No sites-enabled"
            SITE_CONF=$(ls /etc/nginx/sites-enabled/ 2>/dev/null | head -1)
            if [ -n "$SITE_CONF" ]; then
              cat /etc/nginx/sites-enabled/$SITE_CONF
            fi

            echo "Restarting API..."
            pm2 restart evaya-api

            echo "Deploy complete."
