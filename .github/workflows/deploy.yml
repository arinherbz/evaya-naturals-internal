name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: evaya-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci
          npm --prefix server ci
          npm --prefix client ci

      - name: Run typecheck
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build production artifacts
        run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Deploy verified commit to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_COMMIT: ${{ github.sha }}
          APP_DIR: /var/www/evaya-naturals-internal
          APP_DOMAIN: evayainternal.com
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: TARGET_COMMIT,APP_DIR,APP_DOMAIN
          script_stop: true
          command_timeout: 50m
          script: |
            set -euo pipefail
            cd "$APP_DIR"
            PREVIOUS_COMMIT="$(git rev-parse HEAD)"
            echo "[deploy] previous commit: ${PREVIOUS_COMMIT}"
            git fetch origin main
            REMOTE_MAIN="$(git rev-parse origin/main)"
            echo "[deploy] remote main: ${REMOTE_MAIN}"
            if [ "${REMOTE_MAIN}" != "${TARGET_COMMIT}" ]; then
              echo "[deploy] target commit ${TARGET_COMMIT} does not match origin/main ${REMOTE_MAIN}" >&2
              exit 1
            fi
            TMP_ENV_DIR="$(mktemp -d)"
            for env_file in .env server/.env client/.env; do
              if [ -f "${env_file}" ]; then
                mkdir -p "${TMP_ENV_DIR}/$(dirname "${env_file}")"
                cp "${env_file}" "${TMP_ENV_DIR}/${env_file}"
              fi
            done
            git checkout main
            git clean -fd
            git pull --ff-only origin main
            for env_file in .env server/.env client/.env; do
              if [ -f "${TMP_ENV_DIR}/${env_file}" ]; then
                mkdir -p "$(dirname "${env_file}")"
                cp "${TMP_ENV_DIR}/${env_file}" "${env_file}"
              fi
            done
            rm -rf "${TMP_ENV_DIR}"
            CURRENT_COMMIT="$(git rev-parse HEAD)"
            echo "[deploy] checked out commit: ${CURRENT_COMMIT}"
            if [ "${CURRENT_COMMIT}" != "${TARGET_COMMIT}" ]; then
              echo "[deploy] checked out commit does not match GitHub SHA" >&2
              exit 1
            fi
            export PREVIOUS_COMMIT
            bash scripts/deploy-production.sh

      - name: Verify public endpoints after deploy
        run: |
          set -euo pipefail
          bash scripts/smoke-check.sh https://evayainternal.com
