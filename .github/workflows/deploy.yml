name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            cd /var/www/evaya-naturals-internal
            git pull origin main

            echo "Building server..."
            cd server
            npm ci
            npm run build

            echo "Building client..."
            cd ../client
            npm ci
            npm run build

            echo "Fixing nginx cache headers..."
            cat > /etc/nginx/sites-available/evaya << 'NGINX_EOF'
            server {
                server_name evayainternal.com;
                root /var/www/evaya-naturals-internal/client/dist;
                index index.html;

                # Never cache index.html so new deploys are visible immediately
                location = /index.html {
                    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
                    add_header Pragma "no-cache" always;
                    expires 0;
                }

                # Cache hashed assets forever (filenames change on every build)
                location ~* /assets/ {
                    expires 1y;
                    add_header Cache-Control "public, immutable" always;
                }

                location / {
                    try_files $uri /index.html;
                }

                location /api/ {
                    proxy_pass http://127.0.0.1:3001;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                listen 443 ssl; # managed by Certbot
                ssl_certificate /etc/letsencrypt/live/evayainternal.com/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/evayainternal.com/privkey.pem;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
            }

            server {
                if ($host = evayainternal.com) {
                    return 301 https://$host$request_uri;
                }
                listen 80;
                server_name evayainternal.com;
                return 404;
            }
            NGINX_EOF

            ln -sf /etc/nginx/sites-available/evaya /etc/nginx/sites-enabled/evaya
            nginx -t && systemctl reload nginx
            echo "Nginx reloaded with cache headers"

            echo "Restarting API..."
            pm2 restart evaya-api

            echo "Deploy complete."
